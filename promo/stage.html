<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Portfel promo stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=block" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0b; --text: #f5f5f5; --muted: #a3a3a3; --gold: #f5c451; --line: #2a2a2a;
  --ease: cubic-bezier(0.16, 1, 0.3, 1); --move: cubic-bezier(0.65, 0, 0.35, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
em { font-style: normal; color: var(--gold); }

/* backdrop: drifting gold glow over a faint dot grid */
#bg { position: absolute; inset: 0; overflow: hidden; }
#bg::before { content: ''; position: absolute; width: 1400px; height: 1400px; left: 50%; top: 50%; margin: -700px;
  background: radial-gradient(closest-side, rgb(245 196 81 / 0.16), transparent 70%);
  animation: drift 18s ease-in-out infinite alternate; }
#bg::after { content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(rgb(255 255 255 / 0.07) 1px, transparent 1px); background-size: 32px 32px;
  mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%); }
@keyframes drift { from { transform: translate(-380px, -120px) } to { transform: translate(360px, 140px) } }

/* word-by-word reveal used by every headline */
.w { display: inline-block; opacity: 0; transform: translateY(0.45em); filter: blur(10px);
  animation: rise 0.9s var(--ease) forwards; animation-delay: calc(var(--i) * 70ms); }
@keyframes rise { to { opacity: 1; transform: none; filter: none } }
.out .w { animation: sink 0.45s var(--move) forwards; animation-delay: calc(var(--i) * 25ms); opacity: 1; filter: none; transform: none; }
@keyframes sink { to { opacity: 0; transform: translateY(-0.35em); filter: blur(8px) } }

/* centered title cards */
#card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 28px; padding: 0 160px 80px; }
#card h1 { font-size: 92px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.04; }
#card h2 { font-size: 40px; font-weight: 400; color: var(--muted); letter-spacing: -0.01em; }
#card .logo { height: 54px; width: 305px; opacity: 0; animation: fade 1.2s var(--ease) forwards; }
#card .brand { display: flex; align-items: center; justify-content: center; gap: 22px; }
#card .brand b { font-size: 58px; font-weight: 600; color: var(--muted); letter-spacing: -0.02em; opacity: 0; animation: fade 1.2s var(--ease) 0.35s forwards; }
#card .rule { width: 0; height: 2px; background: var(--gold); margin: 0 auto; animation: grow 1.1s var(--ease) 0.6s forwards; }
@keyframes grow { to { width: 120px } }
@keyframes fade { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 1300px; margin: 0 auto; }
.chip { font: 500 26px 'Geist Mono', monospace; padding: 14px 24px; border: 1px solid #3a3a3a; border-radius: 999px; background: rgb(255 255 255 / 0.03);
  opacity: 0; animation: fade 0.8s var(--ease) forwards; animation-delay: calc(0.5s + var(--i) * 90ms); }
.chip::before { content: '● '; color: var(--c, var(--gold)); }
.code { font: 400 26px/1.6 'Geist Mono', monospace; text-align: left; margin: 0 auto; padding: 26px 34px; border-radius: 14px;
  background: #141414; border: 1px solid var(--line); color: var(--muted); opacity: 0; animation: fade 0.9s var(--ease) 1.4s forwards; }
.code b { color: var(--gold); font-weight: 500 } .code i { color: #6cb8e8; font-style: normal }
.links { font: 400 28px 'Geist Mono', monospace; color: var(--muted); display: grid; gap: 10px; opacity: 0; animation: fade 1s var(--ease) 0.9s forwards; }
.links span { color: var(--text) }
.fine { font-size: 21px; color: #8a8a8a; opacity: 0; animation: fade 1s var(--ease) 1.6s forwards; }

/* left column headline next to the app */
#copy { position: absolute; left: 110px; top: 0; bottom: 120px; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 26px;
  transition: opacity 0.6s, transform 0.9s var(--ease); }
#copy .eyebrow { font: 500 20px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); display: flex; gap: 14px; align-items: center; }
#copy .eyebrow::after { content: ''; height: 1px; width: 60px; background: rgb(245 196 81 / 0.5); }
#copy h1 { font-size: 60px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; }
body:not([data-layout='app']):not([data-layout='multi']) #copy { opacity: 0; transform: translateX(-40px); }

/* browser window holding the real app */
#device { position: absolute; left: 0; top: 0; width: 1440px; transform-origin: 0 0; border-radius: 16px; overflow: hidden;
  background: #141414; border: 1px solid #333; box-shadow: 0 50px 120px -30px #000, 0 0 0 1px rgb(255 255 255 / 0.04), 0 0 140px -40px rgb(245 196 81 / 0.35);
  transition: transform 1.3s var(--move), opacity 0.9s var(--ease);
  transform: translate(660px, 1120px) scale(0.85); opacity: 0; }
body[data-layout='app'] #device { transform: translate(658px, 118px) scale(0.85); opacity: 1; }
body[data-layout='multi'] #device { transform: translate(660px, 270px) scale(0.6); opacity: 1; }
.bar { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #1b1b1b; border-bottom: 1px solid #2a2a2a; }
.bar i { width: 13px; height: 13px; border-radius: 50%; background: #3a3a3a; }
.bar .url { margin: 0 auto; transform: translateX(-30px); font: 400 15px 'Geist Mono', monospace; color: #8a8a8a; background: #111; padding: 6px 22px; border-radius: 8px; }
.vp { width: 1440px; height: 900px; overflow: hidden; position: relative; }
#cam { width: 1440px; height: 900px; transform-origin: 0 0; transition: transform 1.4s var(--move); }
iframe { border: 0; display: block; background: #141414; }

/* phone */
#phone { position: absolute; left: 0; top: 0; padding: 14px; border-radius: 62px; background: #050505; border: 2px solid #3a3a3a;
  box-shadow: 0 50px 120px -20px #000, 0 0 120px -40px rgb(245 196 81 / 0.4); transform-origin: 0 0;
  transition: transform 1.4s var(--move), opacity 0.9s; transform: translate(1460px, 1200px) scale(0.86); opacity: 0; }
body[data-layout='multi'] #phone { transform: translate(1440px, 150px) scale(0.86); opacity: 1; }
#phone .screen { border-radius: 48px; overflow: hidden; }

/* fake cursor + click ripple */
#cursor { position: absolute; left: 0; top: 0; width: 30px; z-index: 20; opacity: 0; pointer-events: none;
  transition: transform 0.75s var(--move), opacity 0.4s; filter: drop-shadow(0 4px 10px rgb(0 0 0 / 0.6)); }
#cursor.on { opacity: 1 }
#cursor.fast { transition: transform 0.06s linear, opacity 0.4s; }
.ripple { position: absolute; width: 18px; height: 18px; margin: -9px; border-radius: 50%; border: 2px solid var(--gold); z-index: 19; pointer-events: none;
  animation: ripple 0.6s var(--ease) forwards; }
@keyframes ripple { from { transform: scale(0.4); opacity: 1 } to { transform: scale(3.4); opacity: 0 } }

/* English subtitle */
#sub { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; z-index: 30; }
#sub span { display: inline-block; max-width: 1500px; font-size: 30px; font-weight: 500; line-height: 1.35; padding: 10px 26px; border-radius: 12px;
  background: rgb(0 0 0 / 0.72); color: #f5f5f5; backdrop-filter: blur(6px); transition: opacity 0.35s, transform 0.5s var(--ease); }
#sub span:empty { opacity: 0 }
#sub span.swap { opacity: 0; transform: translateY(8px) }
</style>
</head>
<body data-layout="title">
<div id="bg"></div>
<div id="card"></div>
<aside id="copy"><div class="eyebrow" id="eyebrow"></div><h1 id="head"></h1></aside>
<div id="device">
  <div class="bar"><i></i><i></i><i></i><span class="url" id="url">Portfel · redesign da /carteira</span></div>
  <div class="vp"><div id="cam"><iframe id="app" width="1440" height="900"></iframe></div></div>
</div>
<div id="phone"><div class="screen"><iframe id="mob" width="390" height="844"></iframe></div></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9.5-7 1.6-3.6 6.9z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div id="sub"><span></span></div>
<script>
const $ = s => document.querySelector(s)
const sleep = ms => new Promise(r => setTimeout(r, ms * (window.K || 1)))
// wraps each word (keeping <em> accents) in a staggered span
const words = (html, start = 0) => {
  let i = start
  const box = document.createElement('div'); box.innerHTML = html
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const frag = document.createDocumentFragment()
      c.textContent.split(/(\s+)/).forEach(p => frag.append(/^\s*$/.test(p) ? p : Object.assign(document.createElement('span'), { className: 'w', textContent: p, style: `--i:${i++}` })))
      c.replaceWith(frag)
    } else if (c.nodeType === 1 && c.tagName !== 'BR') walk(c)
  })
  walk(box)
  return box.innerHTML
}
async function swapOut(el) { if (!el.innerHTML.trim()) return; el.classList.add('out'); await sleep(450); el.classList.remove('out') }

window.stage = {
  layout: l => { document.body.dataset.layout = l },
  async card(html) { await swapOut($('#card')); $('#card').innerHTML = html },
  async head(eyebrow, html) {
    await swapOut($('#copy'))
    $('#eyebrow').textContent = eyebrow
    $('#head').innerHTML = words(html)
  },
  words,
  async sub(text) {
    const s = $('#sub span'); s.classList.add('swap'); await sleep(250); s.textContent = text; s.classList.remove('swap')
  },
  url: t => { $('#url').textContent = t },
  // put app point (x, y) at the window centre at zoom s, never showing past the app's edges
  cam(x, y, s = 1) {
    const W = 1440, H = 900, c = (v, min) => Math.min(0, Math.max(min, v))
    $('#cam').style.transform = `translate(${c(W / 2 - x * s, W - W * s)}px, ${c(H / 2 - y * s, H - H * s)}px) scale(${s})`
  },
  cursor(x, y, fast) {
    const k = $('#cursor'); k.classList.add('on'); k.classList.toggle('fast', !!fast)
    k.style.transform = `translate(${x - 6}px, ${y - 3}px)`
  },
  hideCursor: () => $('#cursor').classList.remove('on'),
  ripple(x, y) {
    const r = Object.assign(document.createElement('div'), { className: 'ripple' })
    r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.append(r); sleep(700).then(() => r.remove())
  },
}
</script>
</body>
</html>
